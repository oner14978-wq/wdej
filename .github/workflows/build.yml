name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Tipo de compilação"
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug

  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      # RUST
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: |
            petlib-rust-${{ runner.os }}-

      # CARGO-NDK CORRIGIDO
      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustup toolchain install stable --profile minimal
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          cargo install cargo-ndk --locked

          echo "Verificando ferramentas Rust..."

          command -v cargo
          command -v rustup
          command -v cargo-ndk

          cargo --version
          rustc --version
          cargo ndk --version

          echo "Alvos Android instalados:"
          rustup target list --installed

      # ANDROID NDK
      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="25.2.9519653"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::SDK Manager não encontrado."
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --install "platform-tools" "ndk;${NDK_VERSION}"

          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ ! -f "$NDK_PATH/source.properties" ]; then
            echo "::error::NDK $NDK_VERSION não foi encontrado."
            exit 1
          fi

          echo "NDK instalado: $NDK_PATH"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      # VERIFICAÇÃO
      - name: Verify Rust and Android environment
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$PATH"

          echo "Java:"
          java -version

          echo "Rust:"
          rustc --version
          cargo --version

          echo "Cargo NDK:"
          cargo ndk --version

          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          test -f "$ANDROID_NDK_HOME/source.properties"

          echo "Verificando os quatro alvos..."

          for target in \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          do
            rustup target list --installed | grep -Fx "$target"
          done

      # COMPILAÇÃO
      - name: Build APK for ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$PATH"

          chmod +x gradlew

          VARIANT="${{ inputs.variant }}"

          if [ -z "$VARIANT" ]; then
            VARIANT="Debug"
          fi

          echo "Compilando variante: $VARIANT"
          echo "Arquitetura: ${{ matrix.arch }}"

          ./gradlew \
            "ZalithLauncher:assemble${VARIANT}" \
            -Darch="${{ matrix.arch }}" \
            --no-daemon \
            --stacktrace

      # APK RELEASE
      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      # APK DEBUG
      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant != 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
