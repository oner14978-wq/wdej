
name: Construir Zalith Launcher 2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir Zalith Launcher 2
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. BAIXAR O REPOSITÓRIO
      # ==========================================

      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      # ==========================================
      # 2. VERIFICAR AS 18 PARTES
      # ==========================================

      - name: Verificar arquivos divididos
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando as 18 partes do projeto..."

          python3 - <<'PY'
          import os
          import re
          import sys

          parts = {}

          for name in os.listdir("."):
              match = re.search(r'\.(\d{3})$', name)

              if match:
                  number = int(match.group(1))
                  if 1 <= number <= 18:
                      if number in parts:
                          print("Parte duplicada:", number)
                          sys.exit(1)
                      parts[number] = name

          missing = [
              i for i in range(1, 19)
              if i not in parts
          ]

          if missing:
              print("Partes ausentes:", missing)
              sys.exit(1)

          for i in range(1, 19):
              print(f"{i:03d}: {parts[i]}")

          print("Todas as partes foram encontradas.")
          PY

      # ==========================================
      # 3. RECONSTRUIR E EXTRAIR O ZIP
      # ==========================================

      - name: Reconstruir arquivo ZIP original
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source extracted

          python3 - <<'PY'
          import os
          import re
          import zipfile
          import sys

          parts = {}

          for name in os.listdir("."):
              match = re.search(r'\.(\d{3})$', name)

              if match:
                  number = int(match.group(1))
                  if 1 <= number <= 18:
                      parts[number] = name

          output = "source/ZalithLauncher2.zip"

          with open(output, "wb") as result:
              for number in range(1, 19):
                  filename = parts[number]
                  print("Reconstruindo:", filename)

                  with open(filename, "rb") as part:
                      while True:
                          data = part.read(1024 * 1024)
                          if not data:
                              break
                          result.write(data)

          if not zipfile.is_zipfile(output):
              print("ERRO: arquivo reconstruído não é ZIP válido.")
              sys.exit(1)

          with zipfile.ZipFile(output) as archive:
              bad = archive.testzip()

              if bad:
                  print("Arquivo corrompido:", bad)
                  sys.exit(1)

              archive.extractall("extracted")

          print("ZIP reconstruído e extraído.")
          PY

      # ==========================================
      # 4. LOCALIZAR O PROJETO GRADLE
      # ==========================================

      - name: Localizar projeto Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando gradlew..."

          GRADLEW=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado."
            find extracted -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR="$(realpath "$(dirname "$GRADLEW")")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Diretório do projeto:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # ==========================================
      # 5. INSTALAR JAVA 21
      # ==========================================

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # 6. INSTALAR ANDROID SDK COMMAND-LINE 16.0
      # ==========================================

      - name: Instalar Android SDK Command-line Tools 16.0
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"
          TEMP_DIR="$RUNNER_TEMP/android-sdk-tools"

          mkdir -p "$TEMP_DIR"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "Baixando Command-line Tools 16.0..."

          curl -fL --retry 5 --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            -o "$TEMP_DIR/commandline-tools.zip"

          echo "Extraindo ferramentas..."

          unzip -q -o "$TEMP_DIR/commandline-tools.zip" \
            -d "$TEMP_DIR"

          if [ ! -f "$TEMP_DIR/cmdline-tools/bin/sdkmanager" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "Substituindo ferramentas antigas..."

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mv "$TEMP_DIR/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          chmod +x "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Versão instalada:"
          "$SDKMANAGER" --version

          echo "Aceitando licenças..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

      # ==========================================
      # 7. DETECTAR E INSTALAR COMPILE SDK
      # ==========================================

      - name: Detectar e instalar plataforma Android do projeto
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Detectando compileSdk nos arquivos Gradle..."

          COMPILE_SDK=$(python3 - "$PROJECT_DIR" <<'PY'
          import os
          import re
          import sys

          root = sys.argv[1]
          found = []

          patterns = [
              r'\bcompileSdk(?:Version)?\s*(?:=\s*)?["\']?(\d+)',
              r'\bcompileSdkPreview\s*(?:=\s*)?["\']([^"\']+)'
          ]

          for base, dirs, files in os.walk(root):
              dirs[:] = [
                  d for d in dirs
                  if d not in (".git", ".gradle", "build")
              ]

              for name in files:
                  if name.endswith((".gradle", ".gradle.kts")):
                      path = os.path.join(base, name)

                      try:
                          with open(path, encoding="utf-8") as f:
                              content = f.read()
                      except Exception:
                          continue

                      for pattern in patterns:
                          for match in re.findall(pattern, content):
                              if isinstance(match, str) and match.isdigit():
                                  found.append(int(match))

          if not found:
              print(
                  "Não foi possível detectar compileSdk nos arquivos Gradle.",
                  file=sys.stderr
              )
              sys.exit(1)

          version = max(found)

          print("Compile SDK principal detectado:", version,
                file=sys.stderr)

          print(version)
          PY
          )

          echo "Compile SDK principal: $COMPILE_SDK"

          echo "Instalando plataforma Android $COMPILE_SDK..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK"

          echo "Verificando plataforma instalada..."

          if [ ! -d "$SDK_ROOT/platforms/android-$COMPILE_SDK" ]; then
            echo "ERRO: plataforma Android não foi instalada."
            exit 1
          fi

          echo "ANDROID_COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"

          echo "Plataforma Android instalada com sucesso."

      # ==========================================
      # 8. VERIFICAR AMBIENTE
      # ==========================================

      - name: Verificar Java e Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========== JAVA =========="
          java -version

          echo "========== ANDROID SDK =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "========== SDKMANAGER =========="
          sdkmanager --version

          echo "========== PLATAFORMAS =========="
          ls -la "$ANDROID_HOME/platforms"

          echo "========== BUILD TOOLS =========="
          ls -la "$ANDROID_HOME/build-tools" || true

          echo "========== ADB =========="
          adb version

      # ==========================================
      # 9. VERIFICAR PROJETOS GRADLE
      # ==========================================

      - name: Identificar módulos Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 10. COMPILAR APK DEBUG
      # ==========================================

      - name: Compilar APK Debug
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          echo "======================================"
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "======================================"

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Compile SDK:"
          echo "$ANDROID_COMPILE_SDK"

          echo "Iniciando Gradle..."

          set -o pipefail

          ./gradlew assembleDebug \
            -Darch=all \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "RESULTADO DA COMPILAÇÃO"
          echo "======================================"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "COMPILAÇÃO FALHOU."
            echo ""
            echo "Últimas 200 linhas:"
            tail -n 200 "$LOG"
          else
            echo "COMPILAÇÃO CONCLUÍDA."
          fi

          exit "$BUILD_STATUS"

      # ==========================================
      # 11. SALVAR LOG MESMO SE FALHAR
      # ==========================================

      - name: Salvar log completo do Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      # ==========================================
      # 12. VERIFICAR APK
      # ==========================================

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando arquivos APK..."

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum APK foi encontrado."
            exit 1
          fi

          echo "Quantidade de APKs: $APK_COUNT"

      # ==========================================
      # 13. DISPONIBILIZAR APK
      # ==========================================

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
