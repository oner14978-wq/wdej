
name: Construir Zalith Launcher 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zalith-launcher2-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. BAIXAR REPOSITÓRIO
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Informações do ambiente
        shell: bash
        run: |
          set -euo pipefail
          echo "CONSTRUÇÃO DO ZALITH LAUNCHER 2"
          lsb_release -a
          uname -a
          df -h

      # 2. VERIFICAR OS 18 ARQUIVOS
      - name: Verificar os 18 pedaços
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source extracted

          for NUMBER in $(seq 1 18); do
            SUFFIX=$(printf '%03d' "$NUMBER")

            mapfile -t MATCHES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -name "*.${SUFFIX}"
            )

            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::Esperado um arquivo .$SUFFIX; encontrados ${#MATCHES[@]}."
              exit 1
            fi

            echo "OK: ${MATCHES[0]}"
          done

      # 3. RECONSTRUIR ZIP
      - name: Reconstruir ZIP
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/source/ZalithLauncher2.zip"
          rm -f "$OUTPUT"
          touch "$OUTPUT"

          for NUMBER in $(seq 1 18); do
            SUFFIX=$(printf '%03d' "$NUMBER")

            mapfile -t MATCHES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -name "*.${SUFFIX}"
            )

            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::Pedaço .$SUFFIX não localizado."
              exit 1
            fi

            echo "Adicionando ${MATCHES[0]}"
            cat "${MATCHES[0]}" >> "$OUTPUT"
          done

          ls -lh "$OUTPUT"

          unzip -t "$OUTPUT"

      # 4. EXTRAIR CÓDIGO
      - name: Extrair código-fonte
        shell: bash
        run: |
          set -euo pipefail

          unzip -q source/ZalithLauncher2.zip -d extracted

          echo "Extração concluída."
          find extracted -maxdepth 3 -type f | head -150

      # 5. LOCALIZAR GRADLE
      - name: Localizar projeto Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              GRADLEW="$FILE"
              break
            fi
          done < <(find extracted -type f -name gradlew)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 6. JAVA 21
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            extracted/**/gradle/wrapper/gradle-wrapper.properties
            extracted/**/*.gradle
            extracted/**/*.gradle.kts
            extracted/**/gradle.properties

      - name: Verificar Java
        shell: bash
        run: |
          java -version
          javac -version

      # 7. COMMAND LINE TOOLS
      - name: Instalar Android Command Line Tools 16
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_HOME"
          CMD_DIR="$SDK_ROOT/cmdline-tools"
          TEMP_DIR="$RUNNER_TEMP/android-command-tools"

          mkdir -p "$CMD_DIR" "$TEMP_DIR"
          cd "$TEMP_DIR"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            -o commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$CMD_DIR/latest"
          mkdir -p "$CMD_DIR/latest"

          mv cmdline-tools/* "$CMD_DIR/latest/"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$CMD_DIR/latest/bin" >> "$GITHUB_PATH"

          echo "Command Line Tools instalados."

      # 8. ACEITAR LICENÇAS SEM FALSO ERRO DE BROKEN PIPE
      - name: Aceitar licenças Android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          echo "Verificando SDK Manager:"
          "$SDKMANAGER" --version

          echo "Aceitando licenças Android..."

          set +e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          STATUS=("${PIPESTATUS[@]}")
          set -e

          YES_STATUS="${STATUS[0]}"
          SDK_STATUS="${STATUS[1]}"

          echo "Código do yes: $YES_STATUS"
          echo "Código do SDK Manager: $SDK_STATUS"

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "::error::O SDK Manager falhou ao processar as licenças."
            exit "$SDK_STATUS"
          fi

          echo "Licenças processadas pelo SDK Manager."

      # 9. CONSULTAR PACOTES
      - name: Consultar pacotes Android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list \
            > "$RUNNER_TEMP/android-packages.txt"

          echo "Pacotes Android encontrados."

          if ! grep -Fq "platforms;android-37.2" \
            "$RUNNER_TEMP/android-packages.txt"; then

            echo "::error::platforms;android-37.2 não está disponível."

            grep -E 'platforms;android-' \
              "$RUNNER_TEMP/android-packages.txt" |
              tail -40 || true

            exit 1
          fi

      # 10. INSTALAR SDK E NDK SEM PIPE YES
      - name: Instalar Android SDK 37.2 e NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Instalando platform-tools..."
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install "platform-tools"

          echo "Instalando Android 37.2..."
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install "platforms;android-37.2"

          echo "Instalando NDK 25.2.9519653..."
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install "ndk;25.2.9519653"

          echo "Instalação dos pacotes concluída."

      # 11. VERIFICAR SDK E NDK
      - name: Verificar instalações Android
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-37.2"
          test -d "$ANDROID_HOME/ndk/25.2.9519653"

          echo "Plataforma Android:"
          ls -la "$ANDROID_HOME/platforms"

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/25.2.9519653"

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      # 12. VERIFICAR GRADLE
      - name: Verificar estrutura Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Diretório:"
          pwd

          ls -la

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # 13. COMPILAR APK
      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          set -o pipefail

          BUILD_LOG="$GITHUB_WORKSPACE/gradle-build.log"

          echo "=================================="
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "=================================="

          java -version
          ./gradlew --version

          ./gradlew assembleDebug \
            -Darch=all \
            --no-daemon \
            --stacktrace \
            --info 2>&1 |
            tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "FALHA NA COMPILAÇÃO"
            tail -n 200 "$BUILD_LOG"
            exit "$BUILD_STATUS"
          fi

          echo "Compilação concluída."

      # 14. LOCALIZAR APK
      - name: Verificar APK Debug
        if: success()
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk'
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Nenhum APK Debug foi encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          for APK in "${APKS[@]}"; do
            echo "Copiando: $APK"
            cp "$APK" "$GITHUB_WORKSPACE/apk-output/"
          done

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      # 15. ENVIAR LOGS
      - name: Salvar logs da compilação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      # 16. ENVIAR APK
      - name: Enviar APK Debug
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      # 17. RESUMO
      - name: Resumo da construção
        if: always()
        shell: bash
        run: |
          echo "=================================="
          echo "RESUMO ZALITH LAUNCHER 2"
          echo "=================================="

          echo "Ubuntu: 24.04"
          echo "Java: 21"
          echo "Android SDK: 37.2"
          echo "NDK: 25.2.9519653"

          if [ -d "$GITHUB_WORKSPACE/apk-output" ]; then
            ls -lh "$GITHUB_WORKSPACE/apk-output"
          else
            echo "APK não gerado."
          fi
          
