
name: Compilar aplicativo Android

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verificar projeto
        run: |
          echo "Verificando arquivos do projeto..."
          test -f gradlew || {
            echo "ERRO: gradlew não encontrado na raiz."
            exit 1
          }
          test -d ZalithLauncher || {
            echo "ERRO: módulo ZalithLauncher não encontrado."
            exit 1
          }
          chmod +x gradlew

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compilar APK Debug
        run: |
          ./gradlew ZalithLauncher:assembleDebug \
            -Darch=all \
            --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
