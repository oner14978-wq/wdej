
name: Compilar Zalith Launcher 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Reunir partes do código-fonte
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source extracted

          python3 <<'PY'
          import os
          import re
          import glob
          import zipfile

          files = glob.glob("*")
          parts = {}

          for f in files:
              match = re.search(r'\.(\d{3})$', f)
              if match:
                  parts[int(match.group(1))] = f

          expected = list(range(1, 19))
          missing = [n for n in expected if n not in parts]

          if missing:
              raise SystemExit(
                  "Partes ausentes: " + ", ".join(map(str, missing))
              )

          with open("source/ZalithLauncher2.zip", "wb") as output:
              for n in expected:
                  name = parts[n]
                  print("Reunindo:", name)
                  with open(name, "rb") as part:
                      while True:
                          data = part.read(1024 * 1024)
                          if not data:
                              break
                          output.write(data)

          archive = "source/ZalithLauncher2.zip"

          if not zipfile.is_zipfile(archive):
              raise SystemExit(
                  "O arquivo reunido não é um ZIP válido."
              )

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("Arquivo corrompido: " + bad)

              z.extractall("extracted")

          print("ZIP reunido e extraído com sucesso.")
          PY

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=$(find extracted -type f \
            -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::O código-fonte extraído não contém gradlew."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::Arquivo settings.gradle não encontrado."
            exit 1
          fi

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verificar módulos
        run: |
          cd "$PROJECT_DIR"
          ./gradlew projects

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug \
            -Darch=all \
            --no-daemon \
            --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
