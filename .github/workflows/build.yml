
name: Construir Zalith Launcher 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zalith-launcher2-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ================================================
      # 1. BAIXAR O REPOSITÓRIO
      # ================================================
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Informações do ambiente
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CONSTRUÇÃO DO ZALITH LAUNCHER 2"
          echo "======================================"

          lsb_release -a
          echo
          uname -a
          echo
          df -h

      # ================================================
      # 2. LOCALIZAR E VALIDAR OS 18 ARQUIVOS
      # ================================================
      - name: Verificar os 18 pedaços do código-fonte
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          echo "Procurando pedaços .001 até .018..."

          for NUMBER in $(seq 1 18); do
            SUFFIX=$(printf '%03d' "$NUMBER")

            mapfile -t MATCHES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -name "*.${SUFFIX}" \
                -print
            )

            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::Esperado exatamente um arquivo terminado em .$SUFFIX; encontrados ${#MATCHES[@]}."

              echo "Arquivos encontrados:"
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -printf '%f\n' |
                sort

              exit 1
            fi

            echo "OK $SUFFIX: ${MATCHES[0]}"
          done

          echo
          echo "Todos os 18 pedaços foram encontrados."

      # ================================================
      # 3. RECONSTRUIR ZIP NA ORDEM NUMÉRICA
      # ================================================
      - name: Reconstruir arquivo ZIP original
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/source/ZalithLauncher2.zip"

          rm -f "$OUTPUT"
          touch "$OUTPUT"

          for NUMBER in $(seq 1 18); do
            SUFFIX=$(printf '%03d' "$NUMBER")

            mapfile -t MATCHES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -name "*.${SUFFIX}" \
                -print
            )

            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::Erro ao localizar o pedaço .$SUFFIX."
              exit 1
            fi

            PART="${MATCHES[0]}"

            echo "Concatenando pedaço .$SUFFIX: $(basename "$PART")"

            cat "$PART" >> "$OUTPUT"
          done

          echo
          echo "ZIP reconstruído:"
          ls -lh "$OUTPUT"

          echo "Verificando integridade do ZIP..."

          if ! unzip -t "$OUTPUT"; then
            echo "::error::O arquivo reconstruído não passou na validação ZIP."
            echo "Verifique se os 18 arquivos são partes binárias sequenciais do mesmo ZIP."
            exit 1
          fi

          echo "ZIP válido."

      # ================================================
      # 4. EXTRAIR O PROJETO
      # ================================================
      - name: Extrair código-fonte
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "$GITHUB_WORKSPACE/source/ZalithLauncher2.zip" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extração concluída."

          echo "Estrutura do projeto:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 3 \
            -type f |
            head -150

      # ================================================
      # 5. LOCALIZAR GRADLEW
      # ================================================
      - name: Localizar projeto Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              GRADLEW="$FILE"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name gradlew
          )

          if [ -z "$GRADLEW" ]; then
            echo "::error::Não foi encontrado gradlew junto com settings.gradle."

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 5 \
              -type f |
              head -250

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # ================================================
      # 6. CONFIGURAR JAVA 21
      # ================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            extracted/**/gradle/wrapper/gradle-wrapper.properties
            extracted/**/*.gradle
            extracted/**/*.gradle.kts
            extracted/**/gradle.properties

      - name: Verificar Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          echo "JAVA_HOME=$JAVA_HOME"

      # ================================================
      # 7. INSTALAR ANDROID COMMAND LINE TOOLS
      # ================================================
      - name: Instalar Android Command Line Tools 16
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_HOME"
          CMD_DIR="$SDK_ROOT/cmdline-tools"
          TEMP_DIR="$RUNNER_TEMP/android-command-tools"

          mkdir -p "$CMD_DIR"
          mkdir -p "$TEMP_DIR"

          cd "$TEMP_DIR"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            -o commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$CMD_DIR/latest"
          mkdir -p "$CMD_DIR/latest"

          mv cmdline-tools/* "$CMD_DIR/latest/"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$CMD_DIR/latest/bin" >> "$GITHUB_PATH"

          echo "Command Line Tools instalados."

      # ================================================
      # 8. CONFIGURAR SDK MANAGER
      # ================================================
      - name: Configurar Android SDK Manager
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "::error::SDK Manager não encontrado."
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      # ================================================
      # 9. INSTALAR SDK 37.2 E NDK
      # ================================================
      - name: Instalar Android SDK 37.2 e NDK 25
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Consultando pacotes disponíveis..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list \
            > "$RUNNER_TEMP/android-packages.txt"

          if ! grep -Fq "platforms;android-37.2" \
            "$RUNNER_TEMP/android-packages.txt"; then

            echo "::error::Não foi encontrado platforms;android-37.2."

            grep -E 'platforms;android-' \
              "$RUNNER_TEMP/android-packages.txt" |
              tail -40 || true

            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-37.2" \
            "ndk;25.2.9519653"

          echo "SDK e NDK instalados."

      # ================================================
      # 10. VERIFICAR SDK E NDK
      # ================================================
      - name: Verificar instalações Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo
          echo "Plataformas:"
          ls -la "$ANDROID_HOME/platforms"

          echo
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/25.2.9519653"

          echo
          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      # ================================================
      # 11. VERIFICAR PROJETOS GRADLE
      # ================================================
      - name: Verificar estrutura Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Diretório:"
          pwd

          echo "Arquivos:"
          ls -la

          echo "Projetos Gradle:"

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # ================================================
      # 12. COMPILAR APK DEBUG
      # ================================================
      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          set -o pipefail

          BUILD_LOG="$GITHUB_WORKSPACE/gradle-build.log"

          echo "======================================"
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "======================================"

          echo "Java:"
          java -version

          echo "Gradle:"
          ./gradlew --version

          echo "Executando assembleDebug..."

          ./gradlew assembleDebug \
            -Darch=all \
            --no-daemon \
            --stacktrace \
            --info 2>&1 |
            tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "======================================"
            echo "ERRO NA COMPILAÇÃO"
            echo "======================================"

            tail -n 200 "$BUILD_LOG"

            exit "$BUILD_STATUS"
          fi

          echo "Gradle terminou sem reportar falha."

      # ================================================
      # 13. LOCALIZAR APK DEBUG
      # ================================================
      - name: Verificar APK Debug
        if: success()
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Procurando APK Debug..."

          mapfile -t APKS < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Nenhum APK Debug foi encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          for APK in "${APKS[@]}"; do
            echo "APK encontrado: $APK"
            cp "$APK" "$GITHUB_WORKSPACE/apk-output/"
          done

          echo
          echo "Arquivos finais:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      # ================================================
      # 14. ENVIAR LOGS
      # ================================================
      - name: Salvar logs da compilação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      # ================================================
      # 15. ENVIAR APK
      # ================================================
      - name: Enviar APK Debug
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      # ================================================
      # 16. RESUMO FINAL
      # ================================================
      - name: Resumo da construção
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "RESUMO ZALITH LAUNCHER 2"
          echo "======================================"

          echo "Sistema: Ubuntu 24.04"
          echo "Java: 21"
          echo "Android SDK: 37.2"
          echo "NDK: 25.2.9519653"

          if [ -d "$GITHUB_WORKSPACE/apk-output" ]; then
            echo
            echo "APKs:"
            ls -lh "$GITHUB_WORKSPACE/apk-output"
          else
            echo
            echo "APK não gerado."
          fi

          echo
          echo "Consulte os artefatos da execução."
          
