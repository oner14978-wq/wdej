
name: Construir Zalith Launcher 2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir Zalith Launcher 2
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. BAIXAR O REPOSITÓRIO
      # ==========================================

      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      # ==========================================
      # 2. VERIFICAR AS 18 PARTES
      # ==========================================

      - name: Verificar arquivos divididos
        shell: bash
        run: |
          set -e

          echo "Procurando as 18 partes do projeto..."

          python3 - <<'PY'
          import os
          import re
          import sys

          parts = {}

          for name in os.listdir("."):
              match = re.search(r'\.(\d{3})$', name)

              if match:
                  number = int(match.group(1))

                  if 1 <= number <= 18:
                      parts[number] = name

          missing = [
              number
              for number in range(1, 19)
              if number not in parts
          ]

          if missing:
              print("ERRO: partes ausentes:", missing)
              sys.exit(1)

          for number in range(1, 19):
              print(f"{number:03d}: {parts[number]}")

          print("As 18 partes foram encontradas.")
          PY

      # ==========================================
      # 3. RECONSTRUIR O ZIP
      # ==========================================

      - name: Reconstruir arquivo ZIP original
        shell: bash
        run: |
          set -e

          mkdir -p source extracted

          python3 - <<'PY'
          import os
          import re
          import zipfile
          import sys

          parts = {}

          for name in os.listdir("."):
              match = re.search(r'\.(\d{3})$', name)

              if match:
                  number = int(match.group(1))

                  if 1 <= number <= 18:
                      parts[number] = name

          output = "source/ZalithLauncher2.zip"

          with open(output, "wb") as result:
              for number in range(1, 19):
                  filename = parts[number]

                  print("Reconstruindo:", filename)

                  with open(filename, "rb") as part:
                      while True:
                          data = part.read(1024 * 1024)

                          if not data:
                              break

                          result.write(data)

          if not zipfile.is_zipfile(output):
              print("ERRO: arquivo reconstruído não é um ZIP válido.")
              sys.exit(1)

          with zipfile.ZipFile(output) as archive:
              bad_file = archive.testzip()

              if bad_file:
                  print("ZIP corrompido:", bad_file)
                  sys.exit(1)

              archive.extractall("extracted")

          print("ZIP reconstruído e extraído com sucesso.")
          PY

      # ==========================================
      # 4. LOCALIZAR O PROJETO GRADLE
      # ==========================================

      - name: Localizar projeto Gradle
        shell: bash
        run: |
          set -e

          echo "Procurando gradlew..."

          GRADLEW=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado."
            find extracted -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # ==========================================
      # 5. INSTALAR JAVA
      # ==========================================

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # 6. INSTALAR ANDROID SDK 16.0
      # ==========================================

      - name: Instalar Android SDK Command-line Tools 16.0
        shell: bash
        run: |
          set -e

          SDK_ROOT="/usr/local/lib/android/sdk"
          TEMP_DIR="$RUNNER_TEMP/android-sdk-tools"

          mkdir -p "$TEMP_DIR"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "Baixando Android Command-line Tools 16.0..."

          curl -fL --retry 5 --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            -o "$TEMP_DIR/commandline-tools.zip"

          echo "Extraindo ferramentas..."

          unzip -q -o "$TEMP_DIR/commandline-tools.zip" \
            -d "$TEMP_DIR"

          if [ ! -f "$TEMP_DIR/cmdline-tools/bin/sdkmanager" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "Removendo ferramentas antigas..."

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mv "$TEMP_DIR/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          chmod +x "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Versão do sdkmanager instalado:"
          "$SDKMANAGER" --version

          echo "Aceitando licenças..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          echo "Instalando ferramentas Android básicas..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Verificando instalação..."

          "$SDKMANAGER" --version
          "$SDK_ROOT/platform-tools/adb" version

          echo "Android SDK instalado."

      # ==========================================
      # 7. VERIFICAR JAVA E ANDROID SDK
      # ==========================================

      - name: Verificar ambiente de compilação
        shell: bash
        run: |
          set -e

          echo "=================================="
          echo "JAVA"
          echo "=================================="

          java -version

          echo "=================================="
          echo "ANDROID SDK"
          echo "=================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=================================="
          echo "SDKMANAGER"
          echo "=================================="

          sdkmanager --version

          echo "=================================="
          echo "PACOTES INSTALADOS"
          echo "=================================="

          sdkmanager --list_installed

      # ==========================================
      # 8. VERIFICAR PROJETOS GRADLE
      # ==========================================

      - name: Identificar módulos Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 9. COMPILAR APK COM DIAGNÓSTICO COMPLETO
      # ==========================================

      - name: Compilar APK Debug
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=================================="
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "=================================="

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Iniciando Gradle..."

          ./gradlew assembleDebug \
            -Darch=all \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=================================="
          echo "RESULTADO DA COMPILAÇÃO"
          echo "=================================="

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "ERRO: a compilação falhou."
            echo ""
            echo "Últimas 150 linhas do log:"
            tail -n 150 "$GITHUB_WORKSPACE/gradle-build.log"
          else
            echo "COMPILAÇÃO CONCLUÍDA."
          fi

          exit "$BUILD_STATUS"

      # ==========================================
      # 10. ENVIAR LOG MESMO SE FALHAR
      # ==========================================

      - name: Salvar log completo da compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      # ==========================================
      # 11. VERIFICAR APK
      # ==========================================

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          echo "Procurando APKs..."

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APKs encontrados: $APK_COUNT"

      # ==========================================
      # 12. DISPONIBILIZAR APK PARA DOWNLOAD
      # ==========================================

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
