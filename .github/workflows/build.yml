
name: Construir Zalith Launcher 2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir Zalith Launcher 2
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. BAIXAR O REPOSITÓRIO
      # ==========================================

      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      # ==========================================
      # 2. VERIFICAR AS 18 PARTES
      # ==========================================

      - name: Verificar arquivos divididos
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys

          parts = {}

          for name in os.listdir("."):
              match = re.search(r'\.(\d{3})$', name)

              if match:
                  number = int(match.group(1))

                  if 1 <= number <= 18:
                      if number in parts:
                          print("Parte duplicada:", number)
                          sys.exit(1)

                      parts[number] = name

          missing = [
              i for i in range(1, 19)
              if i not in parts
          ]

          if missing:
              print("Partes ausentes:", missing)
              sys.exit(1)

          for i in range(1, 19):
              print(f"{i:03d}: {parts[i]}")

          print("Todas as 18 partes foram encontradas.")
          PY

      # ==========================================
      # 3. RECONSTRUIR O ZIP
      # ==========================================

      - name: Reconstruir arquivo ZIP original
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source extracted

          python3 - <<'PY'
          import os
          import re
          import zipfile
          import sys

          parts = {}

          for name in os.listdir("."):
              match = re.search(r'\.(\d{3})$', name)

              if match:
                  number = int(match.group(1))

                  if 1 <= number <= 18:
                      parts[number] = name

          output = "source/ZalithLauncher2.zip"

          with open(output, "wb") as result:
              for number in range(1, 19):
                  filename = parts[number]

                  print("Reconstruindo:", filename)

                  with open(filename, "rb") as part:
                      while True:
                          data = part.read(1024 * 1024)

                          if not data:
                              break

                          result.write(data)

          if not zipfile.is_zipfile(output):
              print("ERRO: ZIP reconstruído inválido.")
              sys.exit(1)

          with zipfile.ZipFile(output) as archive:
              bad_file = archive.testzip()

              if bad_file:
                  print("ZIP corrompido:", bad_file)
                  sys.exit(1)

              archive.extractall("extracted")

          print("Projeto extraído com sucesso.")
          PY

      # ==========================================
      # 4. LOCALIZAR O PROJETO GRADLE
      # ==========================================

      - name: Localizar projeto Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado."
            find extracted -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR="$(realpath "$(dirname "$GRADLEW")")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # ==========================================
      # 5. INSTALAR JAVA
      # ==========================================

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # 6. INSTALAR ANDROID COMMAND-LINE TOOLS 16.0
      # ==========================================

      - name: Instalar Android SDK Command-line Tools 16.0
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"
          TEMP_DIR="$RUNNER_TEMP/android-sdk-tools"

          mkdir -p "$TEMP_DIR"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "Baixando Command-line Tools 16.0..."

          curl -fL --retry 5 --retry-delay 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            -o "$TEMP_DIR/commandline-tools.zip"

          echo "Extraindo ferramentas..."

          unzip -q -o "$TEMP_DIR/commandline-tools.zip" \
            -d "$TEMP_DIR"

          if [ ! -f "$TEMP_DIR/cmdline-tools/bin/sdkmanager" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mv "$TEMP_DIR/cmdline-tools" \
            "$SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          chmod +x "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Versão instalada:"
          "$SDKMANAGER" --version

          echo "Aceitando licenças..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

      # ==========================================
      # 7. INSTALAR ANDROID PLATFORM 37.2 E NDK
      # ==========================================

      - name: Instalar Android Platform 37.2 e NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Consultando pacotes oficiais..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --list > "$RUNNER_TEMP/android-packages.txt"

          echo "Verificando Android Platform 37.2..."

          if ! grep -Fq "platforms;android-37.2" \
            "$RUNNER_TEMP/android-packages.txt"; then

            echo "ERRO: Android Platform 37.2 não está disponível."
            echo "Pacotes Android 37 encontrados:"
            grep -F "platforms;android-37" \
              "$RUNNER_TEMP/android-packages.txt" || true
            exit 1
          fi

          echo "Android Platform 37.2 encontrada."

          echo "Instalando componentes..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-37.2" \
            "ndk;25.2.9519653"

          echo "Verificando instalação..."

          test -d "$SDK_ROOT/platforms/android-37.2"
          test -d "$SDK_ROOT/ndk/25.2.9519653"

          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "Android Platform 37.2 instalada."
          echo "NDK 25.2.9519653 instalado."

          ls -la "$SDK_ROOT/platforms"
          ls -la "$SDK_ROOT/ndk"

      # ==========================================
      # 8. VERIFICAR AMBIENTE
      # ==========================================

      - name: Verificar Java e Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "========== JAVA =========="
          java -version

          echo "========== SDKMANAGER =========="
          sdkmanager --version

          echo "========== ANDROID SDK =========="
          echo "$ANDROID_HOME"

          echo "========== ANDROID PLATFORM =========="
          ls -la "$ANDROID_HOME/platforms/android-37.2"

          echo "========== ANDROID NDK =========="
          ls -la "$ANDROID_NDK_HOME"

          echo "========== ADB =========="
          adb version

      # ==========================================
      # 9. VERIFICAR MÓDULOS GRADLE
      # ==========================================

      - name: Identificar módulos Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 10. COMPILAR APK DEBUG
      # ==========================================

      - name: Compilar APK Debug
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          LOG="$GITHUB_WORKSPACE/gradle-build.log"

          echo "======================================"
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "======================================"

          java -version

          echo "Android SDK: $ANDROID_HOME"
          echo "Android NDK: $ANDROID_NDK_HOME"

          set -o pipefail

          ./gradlew assembleDebug \
            -Darch=all \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "======================================"
          echo "RESULTADO DA COMPILAÇÃO"
          echo "======================================"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "COMPILAÇÃO FALHOU."
            tail -n 200 "$LOG"
          else
            echo "COMPILAÇÃO CONCLUÍDA."
          fi

          exit "$BUILD_STATUS"

      # ==========================================
      # 11. SALVAR LOG MESMO SE FALHAR
      # ==========================================

      - name: Salvar log completo do Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-Gradle-Log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      # ==========================================
      # 12. VERIFICAR APK
      # ==========================================

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando APKs..."

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APKs encontrados: $APK_COUNT"

      # ==========================================
      # 13. DISPONIBILIZAR APK
      # ==========================================

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
