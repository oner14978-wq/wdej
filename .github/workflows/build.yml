
name: Construir Zalith Launcher 2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Zali*.zip.*'
      - 'Zalit*.zip.*'
      - 'Zalith*.zip.*'

permissions:
  contents: read

concurrency:
  group: zalith-launcher2-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construir Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BUILD_LOG: ${{ github.workspace }}/gradle-build.log

    steps:
      # --------------------------------------------------
      # 1. BAIXAR O REPOSITÓRIO
      # --------------------------------------------------
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Informações do ambiente
        shell: bash
        run: |
          echo "========================================"
          echo "CONSTRUÇÃO DO ZALITH LAUNCHER 2"
          echo "========================================"
          echo "Sistema:"
          lsb_release -a
          echo
          echo "Arquitetura:"
          uname -m
          echo
          echo "Espaço disponível:"
          df -h

      # --------------------------------------------------
      # 2. VERIFICAR OS 18 ARQUIVOS ZIP
      # --------------------------------------------------
      - name: Verificar os 18 pedaços do código-fonte
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          mapfile -t PARTS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -regextype posix-extended \
              -regex '.*/[^/]+\.[0-9]{3}$' |
              sort -V
          )

          echo "Arquivos encontrados: ${#PARTS[@]}"

          if [ "${#PARTS[@]}" -ne 18 ]; then
            echo "::error::Esperados 18 pedaços ZIP, encontrados ${#PARTS[@]}."
            printf '%s\n' "${PARTS[@]}"
            exit 1
          fi

          for i in "${!PARTS[@]}"; do
            expected=$(printf "%03d" "$((i + 1))")
            actual="${PARTS[$i]##*.}"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Pedaço ausente ou fora de ordem: esperado $expected, encontrado $actual"
              exit 1
            fi

            echo "OK: ${PARTS[$i]}"
          done

          echo "Todos os 18 pedaços foram encontrados."

      # --------------------------------------------------
      # 3. RECONSTRUIR O ZIP
      # --------------------------------------------------
      - name: Reconstruir arquivo ZIP original
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/source/ZalithLauncher2.zip"

          : > "$OUTPUT"

          mapfile -t PARTS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -regextype posix-extended \
              -regex '.*/[^/]+\.[0-9]{3}$' |
              sort -V
          )

          for PART in "${PARTS[@]}"; do
            cat "$PART" >> "$OUTPUT"
          done

          echo "Tamanho do ZIP:"
          ls -lh "$OUTPUT"

          echo "Verificando integridade..."

          if ! unzip -t "$OUTPUT"; then
            echo "::error::O ZIP reconstruído está inválido. Verifique se os 18 arquivos são partes binárias sequenciais do mesmo ZIP."
            exit 1
          fi

          echo "ZIP validado."

      # --------------------------------------------------
      # 4. EXTRAIR O CÓDIGO-FONTE
      # --------------------------------------------------
      - name: Extrair código-fonte
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "$GITHUB_WORKSPACE/source/ZalithLauncher2.zip" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Conteúdo extraído:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 3 \
            -type f |
            head -100

      # --------------------------------------------------
      # 5. LOCALIZAR O PROJETO GRADLE
      # --------------------------------------------------
      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              GRADLEW="$FILE"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name gradlew
          )

          if [ -z "$GRADLEW" ]; then
            echo "::error::Não foi encontrado gradlew junto com settings.gradle ou settings.gradle.kts."
            echo "Arquivos encontrados:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # --------------------------------------------------
      # 6. CONFIGURAR JAVA 21
      # --------------------------------------------------
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            extracted/**/gradle/wrapper/gradle-wrapper.properties
            extracted/**/*.gradle
            extracted/**/*.gradle.kts
            extracted/**/gradle.properties

      - name: Verificar Java
        shell: bash
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # --------------------------------------------------
      # 7. INSTALAR ANDROID COMMAND LINE TOOLS
      # --------------------------------------------------
      - name: Instalar Android Command Line Tools 16
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_HOME"
          CMD_DIR="$SDK_ROOT/cmdline-tools"
          TEMP_DIR="$RUNNER_TEMP/android-command-tools"

          mkdir -p "$CMD_DIR"
          mkdir -p "$TEMP_DIR"

          cd "$TEMP_DIR"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
            -o commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$CMD_DIR/latest"
          mkdir -p "$CMD_DIR/latest"

          mv cmdline-tools/* "$CMD_DIR/latest/"

          echo "Android SDK instalado:"
          ls -la "$CMD_DIR/latest"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$CMD_DIR/latest/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 8. CONFIGURAR SDK MANAGER
      # --------------------------------------------------
      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "Verificando SDK Manager:"
          "$SDKMANAGER" --version

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      # --------------------------------------------------
      # 9. INSTALAR ANDROID API 37.2 E NDK
      # --------------------------------------------------
      - name: Instalar Android SDK 37.2 e NDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Consultando pacotes disponíveis..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list > "$RUNNER_TEMP/android-packages.txt"

          if ! grep -Fq "platforms;android-37.2" \
            "$RUNNER_TEMP/android-packages.txt"; then

            echo "::error::O pacote platforms;android-37.2 não apareceu na lista do SDK Manager."
            echo "Pacotes de plataforma disponíveis:"
            grep -E 'platforms;android-' \
              "$RUNNER_TEMP/android-packages.txt" |
              tail -30 || true

            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-37.2" \
            "ndk;25.2.9519653"

          echo "Instalação concluída."

      # --------------------------------------------------
      # 10. VERIFICAR SDK E NDK
      # --------------------------------------------------
      - name: Verificar Android SDK e NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

          echo
          echo "Plataforma Android:"
          ls -la "$ANDROID_HOME/platforms"

          echo
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/25.2.9519653"

          echo
          echo "Build Tools disponíveis:"
          ls -la "$ANDROID_HOME/build-tools" || true

      # --------------------------------------------------
      # 11. VERIFICAR PROJETOS GRADLE
      # --------------------------------------------------
      - name: Verificar estrutura Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Diretório:"
          pwd

          echo "Arquivos Gradle:"
          ls -la

          echo "Projetos:"
          ./gradlew projects \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 12. COMPILAR APK DEBUG
      # --------------------------------------------------
      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          set -o pipefail

          echo "========================================"
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "========================================"

          echo "Java:"
          java -version

          echo "Gradle:"
          ./gradlew --version

          echo "Iniciando assembleDebug..."

          ./gradlew assembleDebug \
            -Darch=all \
            --no-daemon \
            --stacktrace \
            --info 2>&1 |
            tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "========================================"
            echo "FALHA NA COMPILAÇÃO"
            echo "========================================"

            echo "Últimas 200 linhas:"
            tail -n 200 "$BUILD_LOG"

            exit "$BUILD_STATUS"
          fi

          echo "Compilação Gradle concluída."

      # --------------------------------------------------
      # 13. LOCALIZAR APK GERADO
      # --------------------------------------------------
      - name: Verificar APK Debug
        if: success()
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Procurando APKs..."

          find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

          APK_COUNT=$(find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' |
            wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::A compilação terminou, mas nenhum APK Debug foi encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          while IFS= read -r APK; do
            cp "$APK" "$GITHUB_WORKSPACE/apk-output/"
          done < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk'
          )

          echo "APKs encontrados:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      # --------------------------------------------------
      # 14. ENVIAR LOGS MESMO SE A COMPILAÇÃO FALHAR
      # --------------------------------------------------
      - name: Salvar logs da compilação
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Gradle-Log
          path: |
            gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 15. ENVIAR APK DEBUG
      # --------------------------------------------------
      - name: Enviar APK Debug
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 16. RESUMO FINAL
      # --------------------------------------------------
      - name: Resumo da construção
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "RESUMO - ZALITH LAUNCHER 2"
          echo "========================================"

          echo "Sistema: Ubuntu 24.04"
          echo "Java: 21"
          echo "Android SDK: 37.2"
          echo "NDK: 25.2.9519653"

          if [ -d "$GITHUB_WORKSPACE/apk-output" ]; then
            echo
            echo "Arquivos APK:"
            ls -lh "$GITHUB_WORKSPACE/apk-output"
          else
            echo
            echo "Nenhum APK foi produzido."
          fi

          echo
          echo "Consulte os artefatos da execução para baixar o APK e os logs."
          
